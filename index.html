  );
}

function CentriManager({ menu, centri, saveCentri, isMobile }) {
  const [edit, setEdit] = React.useState(null);   // id del centro aperto
  const [nuovaCat, setNuovaCat] = React.useState("");
  const C = { bg:"#1e293b", border:"#334155", input:"#0f172a", text:"#e2e8f0", muted:"#94a3b8" };
  const inputStyle = { background:C.input, border:"1px solid "+C.border, color:C.text, padding:"9px 11px",
                       borderRadius:8, fontSize:14, fontFamily:"inherit", outline:"none", width:"100%", boxSizing:"border-box" };
  const btn = (bg, extra={}) => ({ background:bg, border:"none", color:"#fff", padding:"8px 14px", borderRadius:8,
                                   cursor:"pointer", fontFamily:"inherit", fontSize:13, fontWeight:700, ...extra });

  const patch = (id, campi) => saveCentri(centri.map(c => c.id===id ? {...c, ...campi} : c));

  const aggiungiCentro = () => {
    const nome = window.prompt("Nome del nuovo centro di costo (es. GELATERIA):", "");
    if (!nome || !nome.trim()) return;
    let id = nome.trim().toLowerCase().replace(/[^a-z0-9]/g,"") || ("c"+Date.now());
    while (centri.some(c=>c.id===id)) id += "1";
    saveCentri([...centri, { id, nome:nome.trim().toUpperCase(), emoji:"🏷", cats:[], copie:1,
                             gruppo:id, comanda:false, stazione:nome.trim(), nota:false }]);
    setEdit(id);
  };

  const eliminaCentro = (cen) => {
    if (centri.length <= 1) { alert("Deve restare almeno un centro di costo."); return; }
    const altri = centri.filter(c => c.id !== cen.id);
    const conArticoli = cen.cats.filter(cat => menu.some(i => i.cat === cat));
    let msg = "Eliminare il centro " + etichetta(cen) + "?";
    if (cen.cats.length) msg += "\n\nLe sue categorie (" + cen.cats.join(", ") + ") passeranno a " + etichetta(altri[0]) + ".";
    if (conArticoli.length) msg += "\nGli articoli restano dove sono, cambia solo il reparto di stampa.";
    if (!window.confirm(msg)) return;
    const nuovi = altri.map((c,idx) => idx===0 ? {...c, cats:[...c.cats, ...cen.cats]} : c);
    saveCentri(nuovi);
    if (edit === cen.id) setEdit(null);
  };

  const spostaCat = (cat, versoId) => {
    saveCentri(centri.map(c => {
      const senza = c.cats.filter(x => x !== cat);
      return c.id === versoId ? {...c, cats:[...senza, cat]} : {...c, cats:senza};
    }));
  };

  const eliminaCat = (cen, cat) => {
    const usati = menu.filter(i => i.cat === cat).length;
    if (usati) { alert("Non puoi togliere «"+cat+"»: ci sono ancora "+usati+" articoli in questa categoria.\nSpostali o eliminali prima."); return; }
    patch(cen.id, { cats: cen.cats.filter(x => x !== cat) });
  };

  const aggiungiCat = (cen) => {
    const nome = nuovaCat.trim();
    if (!nome) return;
    if (catsDi(centri).some(c => c.toLowerCase() === nome.toLowerCase())) { alert("Questa categoria esiste già."); return; }
    patch(cen.id, { cats: [...cen.cats, nome] });
    setNuovaCat("");
  };

  return (
    <div style={{background:C.bg,borderRadius:12,padding:isMobile?14:18,border:"1px solid "+C.border,marginBottom:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:6}}>
        <div style={{fontSize:isMobile?15:17,fontWeight:800,color:"#f8fafc"}}>🏭 Centri di costo</div>
        <button onClick={aggiungiCentro} style={btn("#0f766e")}>➕ Nuovo centro</button>
      </div>
      <div style={{fontSize:11,color:"#64748b",marginBottom:12,lineHeight:1.5}}>
        Ogni centro raccoglie una o più categorie del menu e determina su quale scontrino
        finiscono gli articoli. Copie e raggruppamento si impostano in ⚙️ Impostazioni.
      </div>

      {centri.map(cen => {
        const aperto = edit === cen.id;
        const nArt = menu.filter(i => cen.cats.includes(i.cat)).length;
        return (
          <div key={cen.id} style={{border:"1px solid "+C.border,borderRadius:10,padding:12,marginBottom:10,background:C.input}}>
            <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
              <div style={{flex:1,minWidth:150}}>
                <div style={{fontSize:15,fontWeight:800,color:"#f8fafc"}}>{etichetta(cen)}</div>
                <div style={{fontSize:11,color:C.muted,marginTop:3}}>
                  {cen.cats.length ? cen.cats.join(" · ") : "nessuna categoria"} — {nArt} articoli
                  {cen.comanda ? " · comanda: " + cen.stazione : " · nessuna comanda"}
                </div>
              </div>
              <button onClick={()=>setEdit(aperto?null:cen.id)} style={btn(aperto?"#334155":"#1d4ed8")}>{aperto?"Chiudi":"✏️ Modifica"}</button>
              <button onClick={()=>eliminaCentro(cen)} style={{...btn("#7f1d1d"),color:"#fca5a5"}}>🗑</button>
            </div>

            {aperto && (
              <div style={{marginTop:12,borderTop:"1px solid "+C.border,paddingTop:12}}>
                <div style={{display:"grid",gridTemplateColumns:isMobile?"70px 1fr":"80px 1fr 1fr",gap:10,marginBottom:10}}>
                  <div>
                    <div style={{fontSize:11,color:C.muted,marginBottom:4}}>Icona</div>
                    <input value={cen.emoji} onChange={e=>patch(cen.id,{emoji:e.target.value})} style={{...inputStyle,textAlign:"center"}}/>
                  </div>
                  <div>
                    <div style={{fontSize:11,color:C.muted,marginBottom:4}}>Nome</div>
                    <input value={cen.nome} onChange={e=>patch(cen.id,{nome:e.target.value})} style={inputStyle}/>
                  </div>
                  <div>
                    <div style={{fontSize:11,color:C.muted,marginBottom:4}}>Stazione comanda</div>
                    <input value={cen.stazione} onChange={e=>patch(cen.id,{stazione:e.target.value})} style={inputStyle}
                      disabled={!cen.comanda} placeholder="🍽 Cucina"/>
                  </div>
                </div>

                <button onClick={()=>patch(cen.id,{comanda:!cen.comanda})}
                  style={{...btn(cen.comanda?"#14532d":C.input),border:"1px solid "+(cen.comanda?"#15803d":C.border),
                          color:cen.comanda?"#bbf7d0":C.muted,width:"100%",textAlign:"left",marginBottom:8}}>
                  {cen.comanda?"✅":"⬜"} Manda la comanda al display cucina
                </button>
                <button onClick={()=>patch(cen.id,{nota:!cen.nota})}
                  style={{...btn(cen.nota?"#14532d":C.input),border:"1px solid "+(cen.nota?"#15803d":C.border),
                          color:cen.nota?"#bbf7d0":C.muted,width:"100%",textAlign:"left",marginBottom:12}}>
                  {cen.nota?"✅":"⬜"} Chiedi una nota quando si aggiunge un articolo
                </button>

                <div style={{fontSize:12,color:C.muted,fontWeight:700,marginBottom:6}}>Categorie del menu</div>
                {cen.cats.map(cat => (
                  <div key={cat} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:"1px solid "+C.border,flexWrap:"wrap"}}>
                    <div style={{flex:1,fontSize:13,color:C.text}}>{cat}
                      <span style={{color:C.muted,fontSize:11}}> · {menu.filter(i=>i.cat===cat).length} art.</span>
                    </div>
                    <select value={cen.id} onChange={e=>spostaCat(cat, e.target.value)}
                      style={{...inputStyle,width:"auto",padding:"5px 8px",fontSize:12,cursor:"pointer"}}>
                      {centri.map(x => <option key={x.id} value={x.id}>{etichetta(x)}</option>)}
                    </select>
                    <button onClick={()=>eliminaCat(cen, cat)} style={{...btn("#7f1d1d"),color:"#fca5a5",padding:"5px 10px"}}>🗑</button>
                  </div>
                ))}
                <div style={{display:"flex",gap:8,marginTop:10,flexWrap:"wrap"}}>
                  <input value={nuovaCat} onChange={e=>setNuovaCat(e.target.value)} placeholder="Nuova categoria (es. 🍦 Gelati)"
                    style={{...inputStyle,flex:1,minWidth:160}}
                    onKeyDown={e=>{ if(e.key==="Enter") aggiungiCat(cen); }}/>
                  <button onClick={()=>aggiungiCat(cen)} style={btn("#15803d")}>➕ Aggiungi</button>
                </div>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function ArticoliManager({ menu, saveMenu, centri, saveCentri, isMobile }) {
  const CATEGORIE = catsDi(centri);
  const centroLabel = cat => { const c = centroDi(centri, cat); return c ? etichetta(c) : "—"; };
  const [editing, setEditing] = React.useState(null); // id in modifica
  const [draft, setDraft] = React.useState({ name:"", price:"", cat:CATEGORIE[0]||"", variants:"" });
  const [adding, setAdding] = React.useState(false);

  const startAdd = () => {
    setAdding(true);
    setEditing(null);
    setDraft({ name:"", price:"", cat:CATEGORIE[0]||"", variants:"" });
  };
  const startEdit = (item) => {
    setEditing(item.id);
    setAdding(false);
    setDraft({
      name:item.name,
      price:String(item.price),
      cat:item.cat,
      variants: (item.variants || []).join("\n"),
    });
  };
  const cancel = () => { setEditing(null); setAdding(false); };

  // Esporta il menu corrente (con prezzi aggiornati) in un file Excel
  const exportMenuExcel = () => {
    const rows = [["Categoria", "Tipo", "Articolo", "Prezzo (€)", "Opzioni"]];
    CATEGORIE.forEach(cat => {
      menu.filter(i => i.cat === cat).forEach(item => {
        rows.push([
          cat,
          centroLabel(cat),
          item.name,
          Number(item.price.toFixed(2)),
          (item.variants && item.variants.length) ? item.variants.join(" | ") : "",
        ]);
      });
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"] = [{wch:14},{wch:7},{wch:32},{wch:11},{wch:40}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Menu");
    const d = new Date();
    const dateStr = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
    XLSX.writeFile(wb, "menu_festival_" + dateStr + ".xlsx");
  };

  /* ═══ IMPORT MENU DA EXCEL ═══
     Regola: gli articoli GIÀ PRESENTI non vengono mai toccati (né prezzo né
     opzioni). Dal file entrano solo le righe con un nome nuovo. */
  const fileRef = React.useRef(null);

  // "🥤 Analc." → "analc" : confronto tollerante (senza emoji, punti, accenti, maiuscole)
  const normalize = t => String(t||"")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-zA-Z0-9]/g,"").toLowerCase();

  const CAT_ALIAS = {};
  CATEGORIE.forEach(c => { CAT_ALIAS[normalize(c)] = c; });
  // Sinonimi comodi (si può scrivere "Panini" o "Bibite" senza emoji). Valgono
  // solo se la categoria di destinazione esiste ancora nei centri di costo.
  const ALIAS = {
    panino:"🥪 Panini", panini:"🥪 Panini", cibo:"🥪 Panini",
    fritti:"🍟 Fritti", fritto:"🍟 Fritti", fritture:"🍟 Fritti",
    extra:"🍕 Extra", extras:"🍕 Extra",
    pizza:"🍕 Pizza", pizze:"🍕 Pizza",
    analc:"🥤 Analc.", analcolici:"🥤 Analc.", analcolico:"🥤 Analc.", bibite:"🥤 Analc.", bibita:"🥤 Analc.", soft:"🥤 Analc.",
    alcolici:"🍺 Alcolici", alcolico:"🍺 Alcolici", birre:"🍺 Alcolici", cocktail:"🍺 Alcolici", drink:"🍺 Alcolici", drinks:"🍺 Alcolici",
    shot:"🥃 Shot", shots:"🥃 Shot", shottini:"🥃 Shot",
  };
  Object.keys(ALIAS).forEach(k => {
    if (CATEGORIE.includes(ALIAS[k]) && !CAT_ALIAS[k]) CAT_ALIAS[k] = ALIAS[k];
  });
  // Il nome del centro vale come scorciatoia se ha una sola categoria (es. "Gelateria")
  centri.forEach(cen => {
    if (cen.cats.length === 1) {
      const k = normalize(cen.nome);
      if (!CAT_ALIAS[k]) CAT_ALIAS[k] = cen.cats[0];
    }
  });

  // Scarica un template vuoto già impostato con le categorie valide
  const downloadTemplate = () => {
    // Esempi costruiti sulle categorie realmente configurate in questo momento
    const esempi = [
      ["Articolo di esempio 1","6,00",""],
      ["Articolo di esempio 2","4,00",""],
      ["Articolo di esempio 3","5,00","Variante A | Variante B"],
    ];
    const rows = [["Categoria","Articolo","Prezzo","Opzioni"]].concat(
      esempi.map((e,i) => [CATEGORIE[i % CATEGORIE.length] || "", e[0], e[1], e[2]])
    );
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"] = [{wch:16},{wch:34},{wch:10},{wch:46}];
    const guida = XLSX.utils.aoa_to_sheet([
      ["COME COMPILARE IL TEMPLATE"],
      [""],
      ["1. Compila il foglio «Menu», una riga per articolo. Non cambiare i nomi delle colonne."],
      ["2. Categoria: usa una di quelle elencate qui sotto (le emoji non sono obbligatorie)."],
      ["3. Prezzo: in euro, con virgola o punto (es. 4,50 oppure 4.50). Senza il simbolo €."],
      ["4. Opzioni: varianti selezionabili in cassa, separate dalla barra verticale |. Lascia vuoto se non servono."],
      ["5. Cancella le righe di esempio, salva e carica il file con «Importa da Excel»."],
      [""],
      ["Le categorie qui sotto sono quelle configurate ORA nella cassa: se aggiungi o togli"],
      ["un centro di costo da «Articoli», riscarica il template per averlo aggiornato."],
      [""],
      ["ATTENZIONE: gli articoli già presenti in cassa NON vengono modificati."],
      ["Se un nome esiste già, la riga viene saltata. Prezzi e opzioni si cambiano a mano dalla cassa."],
      [""],
      ["CATEGORIE VALIDE"],
      ["Categoria","Reparto di stampa"],
    ].concat(CATEGORIE.map(c => [c, centroLabel(c)])));
    guida["!cols"] = [{wch:60},{wch:20}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Menu");
    XLSX.utils.book_append_sheet(wb, guida, "Istruzioni");
    XLSX.writeFile(wb, "template_menu_festival.xlsx");
  };

  const importMenuExcel = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const wb = XLSX.read(new Uint8Array(ev.target.result), { type:"array" });
        const sheetName = wb.SheetNames.find(n => normalize(n) === "menu") || wb.SheetNames[0];
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval:"" });
        if (!rows.length) { alert("Il file non contiene righe da importare."); return; }

        // Riconosce le colonne comunque siano scritte (Prezzo, Prezzo (€), PREZZO...)
        const keyOf = (row, ...wanted) => {
          const keys = Object.keys(row);
          for (const w of wanted) {
            const k = keys.find(x => normalize(x).indexOf(w) === 0);
            if (k) return k;
          }
          return null;
        };
        const kCat = keyOf(rows[0], "categoria", "cat");
        const kNom = keyOf(rows[0], "articolo", "nome", "prodotto", "descrizione");
        const kPrz = keyOf(rows[0], "prezzo", "price");
        const kOpz = keyOf(rows[0], "opzioni", "varianti", "opzione");
        if (!kNom || !kPrz || !kCat) {
          alert("Colonne non riconosciute.\nIl file deve avere le colonne: Categoria, Articolo, Prezzo, Opzioni.\nScarica il template per essere sicuro del formato.");
          return;
        }

        const esistenti = new Set(menu.map(i => normalize(i.name)));
        let nextId = Math.max(0, ...menu.map(i => i.id)) + 1;
        const nuovi = [];
        const scartati = [];
        const sconosciute = {};   // categorie del file che non esistono in cassa
        const duplicati = [];     // nomi già presenti, non toccati

        rows.forEach((row, idx) => {
          const nome = String(row[kNom]||"").trim();
          if (!nome) return;
          const riga = idx + 2; // +2 = intestazione + base 1
          const cat = CAT_ALIAS[normalize(row[kCat])];
          if (!cat) { sconosciute[String(row[kCat]||"(vuota)").trim()] = (sconosciute[String(row[kCat]||"(vuota)").trim()]||0)+1; return; }
          const prezzo = parseFloat(String(row[kPrz]).replace(/[^0-9,.-]/g,"").replace(",","."));
          if (isNaN(prezzo) || prezzo < 0) { scartati.push("riga " + riga + " (" + nome + "): prezzo non valido"); return; }
          const chiave = normalize(nome);
          if (esistenti.has(chiave)) {                       // ← già in cassa: non si tocca
            const vecchio = menu.find(i => normalize(i.name) === chiave);
            duplicati.push(nome + (vecchio ? " (già in «" + vecchio.cat + "»)" : ""));
            return;
          }
          esistenti.add(chiave);
          const item = { id: nextId++, name: nome, price: prezzo, cat };
          const opz = String(row[kOpz]||"").split(/[|;\n]/).map(v=>v.trim()).filter(Boolean);
          if (opz.length) item.variants = opz;
          nuovi.push(item);
        });

        const listaSconosciute = Object.keys(sconosciute);
        if (listaSconosciute.length) {
          alert(
            "CATEGORIE NON RICONOSCIUTE\n\n" +
            listaSconosciute.map(c => "· " + c + " (" + sconosciute[c] + " righe)").join("\n") +
            "\n\nL'importazione non crea categorie nuove: creale prima in 🍔 Articoli → " +
            "Centri di costo, dentro il centro giusto, poi ricarica il file.\n\n" +
            "Categorie attualmente valide:\n" + CATEGORIE.join(", ")
          );
          if (!nuovi.length) return;
        }
        if (!nuovi.length && !scartati.length && duplicati.length) {
          alert("Nessun articolo nuovo: le " + duplicati.length + " voci del file sono già presenti in cassa (invariate).\n\n" +
                duplicati.slice(0,15).map(d=>"· "+d).join("\n"));
          return;
        }
        const riepilogo =
          "IMPORTAZIONE MENU\n\n" +
          "✅ Nuovi articoli da aggiungere: " + nuovi.length + "\n" +
          "🔒 Già presenti, lasciati invariati: " + duplicati.length + "\n" +
          (duplicati.length ? duplicati.slice(0,10).map(d=>"   · "+d).join("\n") + (duplicati.length>10?"\n   ...":"") + "\n" : "") +
          (scartati.length ? "⚠️ Righe scartate: " + scartati.length + "\n\n" + scartati.slice(0,10).join("\n") + (scartati.length>10 ? "\n..." : "") + "\n" : "") +
          (nuovi.length ? "\nConfermi l'aggiunta?" : "\nNessun articolo da aggiungere.");
        if (!nuovi.length) { alert(riepilogo); return; }
        if (!window.confirm(riepilogo)) return;
        saveMenu([...menu, ...nuovi]);
        alert("Importazione completata: " + nuovi.length + " articoli aggiunti.");
      } catch (err) {
        alert("Errore nella lettura del file: " + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  };

  const saveItem = () => {
    const price = parseFloat(String(draft.price).replace(",","."));
    if (!draft.name.trim() || isNaN(price) || price < 0) {
      alert("Inserisci un nome valido e un prezzo corretto.");
      return;
    }
    // Parsing varianti: split per a capo, trim, scarta vuote
    const variants = draft.variants
      .split("\n")
      .map(v => v.trim())
      .filter(v => v.length > 0);

    const baseItem = { name:draft.name.trim(), price, cat:draft.cat };
    if (variants.length > 0) baseItem.variants = variants;

    if (adding) {
      const newId = Math.max(0, ...menu.map(i=>i.id)) + 1;
      saveMenu([...menu, { id:newId, ...baseItem }]);
    } else {
      saveMenu(menu.map(i => {
        if (i.id !== editing) return i;
        // Se non ci sono varianti, rimuovi il campo
        const updated = {...i, ...baseItem};
        if (variants.length === 0) delete updated.variants;
        return updated;
      }));
    }
    cancel();
  };

  const deleteItem = (item) => {
    if (!window.confirm("Eliminare \"" + item.name + "\" dal menu?")) return;
    saveMenu(menu.filter(i => i.id !== item.id));
  };

  const C = {
    bg:"#1e293b", border:"#334155", input:"#0f172a",
    text:"#e2e8f0", muted:"#94a3b8", price:"#f87171",
  };

  const inputStyle = { background:C.input, border:"1px solid "+C.border, color:C.text, padding:"10px 12px", borderRadius:8, fontSize:14, fontFamily:"inherit", outline:"none", width:"100%", boxSizing:"border-box" };

  const formJSX = (
    <div style={{background:C.input, borderRadius:10, padding:14, marginBottom:12, border:"1px solid "+C.border}}>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        <div>
          <div style={{fontSize:11,color:C.muted,marginBottom:4,textTransform:"uppercase",letterSpacing:0.5}}>Nome prodotto</div>
          <input value={draft.name} onChange={e=>setDraft({...draft,name:e.target.value})} placeholder="Es. Panino Salsiccia" style={inputStyle} autoFocus />
        </div>
        <div style={{display:"flex",gap:10}}>
          <div style={{flex:1}}>
            <div style={{fontSize:11,color:C.muted,marginBottom:4,textTransform:"uppercase",letterSpacing:0.5}}>Prezzo €</div>
            <input value={draft.price} onChange={e=>setDraft({...draft,price:e.target.value})} placeholder="0.00" inputMode="decimal" style={inputStyle} />
          </div>
          <div style={{flex:2}}>
            <div style={{fontSize:11,color:C.muted,marginBottom:4,textTransform:"uppercase",letterSpacing:0.5}}>Categoria</div>
            <select value={draft.cat} onChange={e=>setDraft({...draft,cat:e.target.value})} style={{...inputStyle, cursor:"pointer"}}>
              {centri.map(cen => (
                <optgroup key={cen.id} label={etichetta(cen)}>
                  {cen.cats.map(c => <option key={c} value={c}>{c}</option>)}
                </optgroup>
              ))}
            </select>
          </div>
        </div>
        <div>
          <div style={{fontSize:11,color:C.muted,marginBottom:4,textTransform:"uppercase",letterSpacing:0.5}}>
            Opzioni / Varianti (una per riga, opzionale)
          </div>
          <textarea
            value={draft.variants}
            onChange={e=>setDraft({...draft,variants:e.target.value})}
            placeholder={"Es:\nCipolla + Peperoni\nSolo Cipolla\nSolo Peperoni\nSolo Salsiccia"}
            rows={4}
            style={{...inputStyle, resize:"vertical", fontFamily:"inherit", minHeight:80}}
          />
          <div style={{fontSize:10,color:C.muted,marginTop:4,fontStyle:"italic"}}>
            Se inserisci varianti, al click sull'articolo si aprirà un menu per scegliere l'opzione
          </div>
        </div>
        <div style={{display:"flex",gap:8,marginTop:4}}>
          <button onClick={saveItem} style={{flex:2,background:"#15803d",border:"none",color:"#fff",padding:"11px",borderRadius:8,cursor:"pointer",fontFamily:"inherit",fontSize:14,fontWeight:700}}>
            ✅ Salva
          </button>
          <button onClick={cancel} style={{flex:1,background:"#334155",border:"none",color:C.text,padding:"11px",borderRadius:8,cursor:"pointer",fontFamily:"inherit",fontSize:14}}>
            Annulla
          </button>
        </div>
      </div>
    </div>
  );

  // Raggruppa per categoria
  const byCat = {};
  CATEGORIE.forEach(c => { byCat[c] = menu.filter(i => i.cat === c); });

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:10}}>
        <h2 style={{fontSize:isMobile?18:24,fontWeight:800,color:"#f8fafc",letterSpacing:"-0.4px"}}>🍔 Gestione Articoli</h2>
        {!adding && !editing && (
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button onClick={exportMenuExcel} title="Scarica il menu in Excel" style={{background:"#15803d",border:"none",color:"#fff",padding:"10px 18px",borderRadius:8,cursor:"pointer",fontFamily:"inherit",fontSize:14,fontWeight:700}}>
              📥 Scarica Menu Excel
            </button>
            <button onClick={downloadTemplate} title="Scarica un file Excel vuoto da compilare" style={{background:"#0f766e",border:"none",color:"#fff",padding:"10px 18px",borderRadius:8,cursor:"pointer",fontFamily:"inherit",fontSize:14,fontWeight:700}}>
              📄 Template Excel
            </button>
            <button onClick={()=>fileRef.current && fileRef.current.click()} title="Aggiunge solo gli articoli nuovi" style={{background:"#1d4ed8",border:"none",color:"#fff",padding:"10px 18px",borderRadius:8,cursor:"pointer",fontFamily:"inherit",fontSize:14,fontWeight:700}}>
              📤 Importa da Excel
            </button>
            <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" style={{display:"none"}}
              onChange={e=>{ importMenuExcel(e.target.files[0]); e.target.value=""; }} />
            <button onClick={()=>{
              if (!menu.length) { alert("Il menu è già vuoto."); return; }
              if (window.confirm("Eliminare tutti i " + menu.length + " articoli del menu?\n\nI centri di costo e le categorie restano come sono.\nServe per partire da zero prima di importare un listino da Excel."))
                saveMenu([]);
            }} title="Elimina tutti gli articoli, utile prima di importare un listino nuovo"
              style={{background:"#7f1d1d",border:"none",color:"#fca5a5",padding:"10px 18px",borderRadius:8,cursor:"pointer",fontFamily:"inherit",fontSize:14,fontWeight:700}}>
              🧹 Svuota menu
            </button>
            <button onClick={startAdd} style={{background:"#dc2626",border:"none",color:"#fff",padding:"10px 18px",borderRadius:8,cursor:"pointer",fontFamily:"inherit",fontSize:14,fontWeight:700}}>
              ➕ Nuovo Articolo
            </button>
          </div>
        )}
      </div>

      {adding && formJSX}

      {!adding && !editing && (
        <CentriManager menu={menu} centri={centri} saveCentri={saveCentri} isMobile={isMobile} />
      )}

      {CATEGORIE.map(catName => (
        byCat[catName].length > 0 || true ? (
          <div key={catName} style={{background:C.bg,borderRadius:12,padding:16,border:"1px solid "+C.border,marginBottom:12}}>
            <div style={{fontSize:14,fontWeight:700,color:"#f8fafc",marginBottom:10,display:"flex",alignItems:"center",gap:8}}>
              {catName}
              <span style={{fontSize:11,color:C.muted,fontWeight:400}}>
                ({centroLabel(catName)})
              </span>
            </div>
            {byCat[catName].length === 0 && (
              <div style={{color:"#64748b",fontSize:13,padding:"6px 0"}}>Nessun articolo</div>
            )}
            {byCat[catName].map(item => (
              <div key={item.id}>
                {editing === item.id ? formJSX : (
                  <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderBottom:"1px solid "+C.border}}>
                    <div style={{flex:1}}>
                      <div style={{fontSize:14,color:C.text,fontWeight:600}}>{item.name}</div>
                      <div style={{fontSize:13,color:C.price,fontWeight:700,marginTop:2}}>{fmt(item.price)}</div>
                      {item.variants && item.variants.length > 0 && (
                        <div style={{fontSize:11,color:C.muted,marginTop:3,fontStyle:"italic"}}>
                          🎛 {item.variants.length} opzioni: {item.variants.join(", ")}
                        </div>
                      )}
                    </div>
                    <button onClick={()=>startEdit(item)} title="Modifica" style={{background:"#1d4ed8",border:"none",color:"#fff",padding:"7px 12px",borderRadius:7,cursor:"pointer",fontSize:13,fontWeight:600}}>✏️</button>
                    <button onClick={()=>deleteItem(item)} title="Elimina" style={{background:"#7f1d1d",border:"none",color:"#fca5a5",padding:"7px 12px",borderRadius:7,cursor:"pointer",fontSize:13}}>🗑</button>
                  </div>
                )}
              </div>
            ))}
          </div>
        ) : null
      ))}

      {(() => {
        // Articoli rimasti in categorie che nessun centro possiede: invisibili nelle
        // liste qui sopra, ma ancora nel menu — bloccano l'import per nome e non
        // finiscono su nessuno scontrino. Vanno riassegnati o eliminati.
        const orfane = {};
        menu.forEach(i => { if (!CATEGORIE.includes(i.cat)) (orfane[i.cat] = orfane[i.cat] || []).push(i); });
        const catsOrfane = Object.keys(orfane);
        if (!catsOrfane.length) return null;
        const totale = catsOrfane.reduce((n,c)=>n+orfane[c].length, 0);
        return (
          <div style={{background:"#3f1d1d",border:"1px solid #7f1d1d",borderRadius:12,padding:16,marginBottom:12}}>
            <div style={{fontSize:15,fontWeight:800,color:"#fecaca",marginBottom:6}}>
              ⚠️ {totale} articoli senza centro di costo
            </div>
            <div style={{fontSize:12,color:"#fca5a5",marginBottom:12,lineHeight:1.5}}>
              Appartengono a categorie che non fanno più parte di nessun centro (di solito
              il listino del torneo rimasto dopo aver rifatto i centri). Non compaiono in
              cassa, ma occupano i nomi: un articolo con lo stesso nome non può essere
              importato da Excel. Assegna la categoria a un centro oppure elimina gli articoli.
            </div>
            {catsOrfane.map(cat => (
              <div key={cat} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",borderTop:"1px solid #7f1d1d",flexWrap:"wrap"}}>
                <div style={{flex:1,minWidth:150,fontSize:13,color:"#fee2e2",fontWeight:600}}>
                  {cat} <span style={{fontWeight:400,color:"#fca5a5"}}>· {orfane[cat].length} articoli</span>
                  <div style={{fontSize:11,color:"#fca5a5",marginTop:2}}>
                    {orfane[cat].slice(0,4).map(i=>i.name).join(", ")}{orfane[cat].length>4 ? "…" : ""}
                  </div>
                </div>
                <select value="" onChange={e=>{ if(!e.target.value) return;
                    saveCentri(centri.map(c => c.id===e.target.value ? {...c, cats:[...c.cats, cat]} : c)); }}
                  style={{...inputStyle,width:"auto",padding:"6px 8px",fontSize:12,cursor:"pointer"}}>
                  <option value="">Assegna a…</option>
                  {centri.map(c => <option key={c.id} value={c.id}>{etichetta(c)}</option>)}
                </select>
                <button onClick={()=>{ if(window.confirm("Eliminare i "+orfane[cat].length+" articoli della categoria «"+cat+"»?"))
                    saveMenu(menu.filter(i => i.cat !== cat)); }}
                  style={{background:"#7f1d1d",border:"1px solid #b91c1c",color:"#fca5a5",padding:"7px 12px",borderRadius:7,cursor:"pointer",fontFamily:"inherit",fontSize:12,fontWeight:700}}>
                  🗑 Elimina
                </button>
              </div>
            ))}
          </div>
        );
      })()}

      <div style={{textAlign:"center",marginTop:8,marginBottom:20}}>
        <button onClick={()=>{ if(window.confirm("Ripristinare il menu originale? Tutte le modifiche andranno perse.")) saveMenu(DEFAULT_MENU); }}
          style={{background:"transparent",border:"1px solid "+C.border,color:C.muted,padding:"8px 16px",borderRadius:8,cursor:"pointer",fontFamily:"inherit",fontSize:12}}>
          ↺ Ripristina menu originale
        </button>
      </div>
    </div>
  );
}

/* ═══ CORPO DELLO SCONTRINO ═══
   Un solo componente per mobile e desktop: tutto ciò che viene stampato dipende
   da cfg, quindi si cambia dalle Impostazioni senza toccare il codice. */
function ReceiptBody({ r, cfg }) {
  const F  = parseInt(cfg.fontBase) || 12;
  const Fs = Math.max(8, F - 1);
  const Fx = Math.max(9, F - 2);
  const dash = { borderTop:"1px dashed #000", margin:"8px 0" };
  const mono = "'JetBrains Mono','Courier New',monospace";
  const vuote = Math.max(0, Math.min(10, parseInt(cfg.righeVuote) || 0));
  return (
    <React.Fragment>
      <div style={{textAlign:"center",fontSize:F+4,fontWeight:900}}>{cfg.intestazione}</div>
      {cfg.mostraCentro && r.centro && (
        <div style={{textAlign:"center",fontSize:F+1,fontWeight:900,letterSpacing:2,marginTop:2}}>{r.centro}</div>
      )}
      {cfg.sottotitolo && <div style={{textAlign:"center",fontSize:Fs}}>{cfg.sottotitolo}</div>}
      <div style={dash}/>
      <div style={{textAlign:"center",fontSize:Fs}}>
        N. {String(r.id).padStart(4,"0")}{cfg.mostraData ? " \u2014 " + r.date : ""}
      </div>
      {cfg.mostraNome && r.table && (
        <div style={{textAlign:"center",fontSize:Fs}}>{cfg.etichettaNome}: {r.table}</div>
      )}
      <div style={dash}/>
      <div style={{display:"flex",justifyContent:"space-between",borderBottom:"1px solid #eee",paddingBottom:4,marginBottom:4,fontSize:Fs}}>
        <span>Descrizione</span><span>Qt</span><span>Imp.</span>
      </div>
      {r.items.map((i,idx)=>{
        const baseName = i.variant ? i.name.replace(" ("+i.variant+")","") : i.name;
        const name  = baseName.length>18 ? baseName.substring(0,17)+"." : baseName.padEnd(18," ");
        const qty   = ("x"+i.qty).padStart(3," ");
        const price = fmt(i.price*i.qty).padStart(7," ");
        return (
          <div key={idx}>
            <div style={{fontSize:Fs,padding:"1px 0",fontFamily:mono,whiteSpace:"pre"}}>{name}{qty}{price}</div>
            {i.variant && <div style={{fontSize:Fx,padding:"0 0 1px 6px",fontFamily:mono,fontStyle:"italic"}}>&#8627; {i.variant}</div>}
            {i.note    && <div style={{fontSize:Fx,padding:"0 0 1px 6px",fontFamily:mono,fontStyle:"italic"}}>&#8627; {i.note}</div>}
          </div>
        );
      })}
      <div style={dash}/>
      {r.disc>0 && <React.Fragment>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:Fs}}><span>Subtotale</span><span>{fmt(r.subtotal)}</span></div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:Fs}}><span>Sconto {r.disc}%</span><span>-{fmt(r.discAmt)}</span></div>
      </React.Fragment>}
      <div style={{display:"flex",justifyContent:"space-between",fontWeight:900,fontSize:parseInt(cfg.fontTotale)||16,borderTop:"2px solid #111",marginTop:4,paddingTop:4}}>
        <span>TOTALE</span><span>{fmt(r.total)}</span>
      </div>
      {cfg.mostraPagamento && <div style={{textAlign:"center",fontSize:Fs,marginTop:4}}>{String(r.pay||"").toUpperCase()}</div>}
      {(cfg.piede1 || cfg.piede2) && <div style={dash}/>}
      {cfg.piede1 && <div style={{textAlign:"center",fontSize:Fs}}>{cfg.piede1}</div>}
      {cfg.piede2 && <div style={{textAlign:"center",fontSize:Fs}}>{cfg.piede2}</div>}
      {Array.from({length:vuote}).map((_,i)=>(
        <div key={"v"+i} style={{fontSize:Fs}}>&nbsp;</div>
      ))}
    </React.Fragment>
  );
}

/* ═══ IMPOSTAZIONI SCONTRINO ═══ */
function ScontrinoConfig({ cfg, save, reset, anteprima, centri, saveCentri, isMobile }) {
  const C = { bg:"#1e293b", border:"#334155", input:"#0f172a", text:"#e2e8f0", muted:"#94a3b8" };
  const inputStyle = { background:C.input, border:"1px solid "+C.border, color:C.text, padding:"9px 11px",
                       borderRadius:8, fontSize:14, fontFamily:"inherit", outline:"none", width:"100%", boxSizing:"border-box" };
  /* Nota: helper come funzioni, non come componenti annidati: se fossero
     componenti React li rimonterebbe a ogni tasto e l'input perderebbe il focus. */
  const riga = (label, children, hint) => (
    <div style={{marginBottom:12}}>
      <div style={{fontSize:12,color:C.muted,marginBottom:5,fontWeight:600}}>{label}</div>
      {children}
      {hint && <div style={{fontSize:11,color:"#64748b",marginTop:4,lineHeight:1.4}}>{hint}</div>}
    </div>
  );
  const toggle = (k, label) => (
    <button key={k} onClick={()=>save({[k]: !cfg[k]})}
      style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,width:"100%",
              background:cfg[k]?"#14532d":C.input, border:"1px solid "+(cfg[k]?"#15803d":C.border),
              color:cfg[k]?"#bbf7d0":C.muted, padding:"10px 12px", borderRadius:8, cursor:"pointer",
              fontFamily:"inherit", fontSize:13, fontWeight:600, marginBottom:8, textAlign:"left"}}>
      <span>{label}</span><span style={{fontSize:15}}>{cfg[k] ? "\u2705" : "\u2b1c"}</span>
    </button>
  );
  const num = (k, min, max) => e => {
    const v = parseInt(e.target.value);
    save({[k]: isNaN(v) ? min : Math.max(min, Math.min(max, v))});
  };
  return (
    <div style={{background:C.bg,borderRadius:12,padding:isMobile?14:20,border:"1px solid "+C.border,marginTop:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,marginBottom:10,flexWrap:"wrap"}}>
        <div style={{fontSize:isMobile?15:17,fontWeight:800,color:"#f8fafc"}}>🧾 Scontrino</div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={anteprima} style={{background:"#1d4ed8",border:"none",color:"#fff",padding:"8px 14px",borderRadius:8,cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:700}}>👁 Anteprima</button>
          <button onClick={()=>{ if(window.confirm("Ripristinare le impostazioni scontrino predefinite?")) reset(); }}
            style={{background:"transparent",border:"1px solid "+C.border,color:C.muted,padding:"8px 12px",borderRadius:8,cursor:"pointer",fontFamily:"inherit",fontSize:12}}>↺ Reset</button>
        </div>
      </div>
      <div style={{fontSize:11,color:"#64748b",marginBottom:14,lineHeight:1.5}}>
        Le modifiche valgono subito e vengono sincronizzate su tutte le casse collegate.
      </div>

      <div style={{background:C.input,border:"1px solid "+C.border,borderRadius:10,padding:12,marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:4}}>
          <div style={{fontSize:13,fontWeight:700,color:"#f8fafc"}}>🖨 Stampa per centro di costo</div>
          <div style={{display:"flex",gap:6}}>
            <button onClick={()=>saveCentri(centri.map(c=>({...c, gruppo:centri[0].id})))}
              style={{background:"#334155",border:"none",color:"#e2e8f0",padding:"6px 10px",borderRadius:7,cursor:"pointer",fontFamily:"inherit",fontSize:11,fontWeight:600}}>Unisci tutto</button>
            <button onClick={()=>saveCentri(centri.map(c=>({...c, gruppo:c.id})))}
              style={{background:"#334155",border:"none",color:"#e2e8f0",padding:"6px 10px",borderRadius:7,cursor:"pointer",fontFamily:"inherit",fontSize:11,fontWeight:600}}>Separa tutto</button>
          </div>
        </div>
        <div style={{fontSize:11,color:"#64748b",marginBottom:10,lineHeight:1.5}}>
          <b>Stampa su</b> decide il raggruppamento: due centri che puntano allo stesso scontrino
          escono su un tagliando unico (es. cibo insieme al bere). <b>Copie</b> = quanti tagliandi
          stampare, <b>0 = non stampare</b> (l'incasso resta comunque registrato). Se più centri
          sono uniti vale il numero di copie più alto tra loro.
          I centri si aggiungono o si tolgono da 🍔 Articoli.
        </div>

        {gruppiDi(centri).map(g => (
          <div key={g.gruppo} style={{fontSize:11,color:"#94a3b8",marginBottom:6}}>
            🧾 {labelGruppo(g.centri)} — {copieGruppo(g.centri)===0 ? "non stampato" : copieGruppo(g.centri)+(copieGruppo(g.centri)===1?" copia":" copie")}
          </div>
        ))}

        <div style={{marginTop:8}}>
          {centri.map(cen => (
            <div key={cen.id} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 0",borderTop:"1px solid "+C.border,flexWrap:"wrap"}}>
              <div style={{flex:1,minWidth:110,fontSize:13,color:C.text,fontWeight:600}}>{etichetta(cen)}</div>
              <div>
                <div style={{fontSize:10,color:C.muted,marginBottom:2}}>Stampa su</div>
                <select value={cen.gruppo} onChange={e=>saveCentri(centri.map(c=>c.id===cen.id?{...c,gruppo:e.target.value}:c))}
                  style={{...inputStyle,width:"auto",padding:"6px 8px",fontSize:12,cursor:"pointer"}}>
                  {centri.map(x => (
                    <option key={x.id} value={x.id}>{x.id===cen.id ? "Scontrino proprio" : "Insieme a "+etichetta(x)}</option>
                  ))}
                </select>
              </div>
              <div style={{width:78}}>
                <div style={{fontSize:10,color:C.muted,marginBottom:2}}>Copie</div>
                <input type="number" min="0" max="4" value={cen.copie}
                  onChange={e=>{ const v=parseInt(e.target.value);
                    saveCentri(centri.map(c=>c.id===cen.id?{...c,copie:isNaN(v)?0:Math.max(0,Math.min(4,v))}:c)); }}
                  style={inputStyle}/>
              </div>
            </div>
          ))}
        </div>
      </div>

      {riga("Intestazione stampata",
        <input value={cfg.intestazione} onChange={e=>save({intestazione:e.target.value})} style={inputStyle}/>)}
      {riga("Sottotitolo",
        <input value={cfg.sottotitolo} onChange={e=>save({sottotitolo:e.target.value})} style={inputStyle}/>,
        "Lascia vuoto per non stamparlo.")}
      {riga("Etichetta del nome",
        <input value={cfg.etichettaNome} onChange={e=>save({etichettaNome:e.target.value})} style={inputStyle}/>,
        "Compare come «Tavolo: Rossi» sullo scontrino.")}
      {riga("Quando è obbligatorio il nome",
        <select value={cfg.nomeRichiesto} onChange={e=>save({nomeRichiesto:e.target.value})} style={inputStyle}>
          <option value="cibo">Solo se l'ordine contiene cibo</option>
          <option value="sempre">Sempre</option>
          <option value="mai">Mai</option>
        </select>)}
      {riga("Riga finale 1",
        <input value={cfg.piede1} onChange={e=>save({piede1:e.target.value})} style={inputStyle}/>)}
      {riga("Riga finale 2",
        <input value={cfg.piede2} onChange={e=>save({piede2:e.target.value})} style={inputStyle}/>)}

      <div style={{display:"grid",gridTemplateColumns:isMobile?"1fr 1fr":"repeat(3,1fr)",gap:10}}>
        {riga("Testo (px)",    <input type="number" min="9" max="18" value={cfg.fontBase}   onChange={num("fontBase",9,18)}   style={inputStyle}/>)}
        {riga("Totale (px)",   <input type="number" min="10" max="26" value={cfg.fontTotale} onChange={num("fontTotale",10,26)} style={inputStyle}/>)}
        {riga("Righe finali",  <input type="number" min="0" max="10" value={cfg.righeVuote} onChange={num("righeVuote",0,10)} style={inputStyle}/>, "Avanzamento carta")}
      </div>

      {toggle("autoStampa",      "Stampa automatica alla chiusura ordine")}
      {toggle("mostraCentro",    "Mostra il reparto (BAR / CIBO / PIZZA)")}
      {toggle("mostraData",      "Mostra data e ora")}
      {toggle("mostraNome",      "Mostra " + String(cfg.etichettaNome || "nome").toLowerCase())}
      {toggle("mostraPagamento", "Mostra metodo di pagamento")}
    </div>
  );
}

function FirebaseConfig({ syncStatus }) {
  const fields = [
    ["apiKey","API Key"],
    ["authDomain","Auth Domain"],
    ["databaseURL","Database URL"],
    ["projectId","Project ID"],
    ["storageBucket","Storage Bucket"],
    ["messagingSenderId","Messaging Sender ID"],
    ["appId","App ID"],
  ];
  const [vals, setVals] = React.useState(() => {
    const obj = {};
    fields.forEach(([k])=>{ obj[k]=localStorage.getItem(EVENT_PREFIX+"fb_"+k)||""; });
    return obj;
  });
  const [saved, setSaved] = React.useState(false);

  const save = () => {
    fields.forEach(([k])=>{ localStorage.setItem(EVENT_PREFIX+"fb_"+k, vals[k]); });
    setSaved(true);
    setTimeout(()=>{ window.location.reload(); }, 800);
  };
  const reset = () => {
    fields.forEach(([k])=>{ localStorage.removeItem(EVENT_PREFIX+"fb_"+k); });
    window.location.reload();
  };

  const isConfigured = !!vals.databaseURL;

  return (
    <div style={{background:"#1e293b",borderRadius:12,padding:20,border:"1px solid #334155",marginTop:16}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14,flexWrap:"wrap",gap:8}}>
        <h3 style={{fontSize:15,fontWeight:700,color:"#f8fafc"}}>☁️ Sincronizzazione Firebase</h3>
        <span style={{fontSize:12,padding:"4px 10px",borderRadius:20,fontWeight:700,
          background:syncStatus==="connected"?"#14532d":syncStatus==="connecting"?"#713f12":"#1e293b",
          color:syncStatus==="connected"?"#4ade80":syncStatus==="connecting"?"#fbbf24":"#64748b",
          border:"1px solid currentColor"}}>
          {syncStatus==="connected"?"🟢 Connesso":syncStatus==="connecting"?"🟡 Connessione...":syncStatus==="error"?"🔴 Errore":"⚫ Non configurato"}
        </span>
      </div>
      {!isConfigured && (
        <div style={{background:"#0f172a",borderRadius:8,padding:12,marginBottom:14,fontSize:12,color:"#94a3b8",lineHeight:1.7}}>
          <strong style={{color:"#f8fafc"}}>Come configurare (gratis):</strong><br/>
          1. Vai su <strong style={{color:"#38bdf8"}}>console.firebase.google.com</strong><br/>
          2. Crea progetto → aggiungi app Web<br/>
          3. Vai su <em>Realtime Database</em> → Crea database (modalità test)<br/>
          4. Copia la configurazione e incollala qui sotto<br/>
          5. Salva → il sito si ricarica e sincronizza su tutti i dispositivi 🎉
        </div>
      )}
      <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:14}}>
        {fields.map(([k,label])=>(
          <div key={k}>
            <div style={{fontSize:11,color:"#64748b",marginBottom:3,textTransform:"uppercase",letterSpacing:0.5}}>{label}</div>
            <input value={vals[k]} onChange={e=>setVals(p=>({...p,[k]:e.target.value}))}
              placeholder={label+"..."}
              style={{width:"100%",background:"#0f172a",border:"1px solid #334155",color:"#e2e8f0",padding:"8px 12px",borderRadius:6,fontSize:12,fontFamily:"inherit",outline:"none"}} />
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:8}}>
        <button onClick={save} style={{flex:2,background:saved?"#14532d":"#1d4ed8",border:"none",color:"#fff",padding:"10px",borderRadius:8,cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:700}}>
          {saved?"✅ Salvato! Ricarico...":"💾 Salva e Connetti"}
        </button>
        {isConfigured && <button onClick={reset} style={{flex:1,background:"#7f1d1d",border:"none",color:"#fca5a5",padding:"10px",borderRadius:8,cursor:"pointer",fontFamily:"inherit",fontSize:13}}>
          🔌 Disconnetti
        </button>}
      </div>
    </div>
  );
}

function App() {
  const [authed, setAuthed] = useState(()=>sessionStorage.getItem(EVENT_PREFIX+"auth")==="1");
  const [theme, setTheme] = useState(()=>localStorage.getItem(EVENT_PREFIX+"theme") || "dark");

  useEffect(()=>{
    document.documentElement.className = theme === "light" ? "light" : "";
    localStorage.setItem(EVENT_PREFIX+"theme", theme);
  }, [theme]);

  const toggleTheme = ()=>setTheme(t=>t==="dark"?"light":"dark");
  const login = ()=>{sessionStorage.setItem(EVENT_PREFIX+"auth","1");setAuthed(true);};
  return authed ? <POS theme={theme} toggleTheme={toggleTheme}/> : <Login onLogin={login}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
