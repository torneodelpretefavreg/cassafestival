/* ── LOGIN ── */
function Login({ onLogin }) {
  const [pwd, setPwd] = useState("");
  const [err, setErr] = useState(false);
  const check = () => {
    if (pwd === "festival26") { onLogin(); }
    else { setErr(true); setPwd(""); setTimeout(() => setErr(false), 1500); }
  };
  return (
    <div style={{minHeight:"100vh",background:"#0f172a",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"inherit",padding:20}}>
      <div style={{background:"#1e293b",border:"1px solid #334155",borderRadius:20,padding:"40px 28px",textAlign:"center",width:"100%",maxWidth:340}}>
        <div style={{display:"flex",justifyContent:"center",marginBottom:10}}><Logo size={110}/></div>
        <div style={{fontSize:24,fontWeight:800,color:"#f8fafc",marginBottom:6,letterSpacing:"-0.5px"}}>{EVT.nomeLungo}</div>
        <div style={{fontSize:13,color:"#64748b",marginBottom:28}}>Inserisci la password</div>
        <input type="password" value={pwd}
          onChange={e=>{setPwd(e.target.value);setErr(false);}}
          onKeyDown={e=>e.key==="Enter"&&check()}
          placeholder="Password" autoFocus
          style={{width:"100%",background:err?"#3b0d0d":"#0f172a",border:`2px solid ${err?"#dc2626":"#334155"}`,color:err?"#f87171":"#e2e8f0",padding:"14px 16px",borderRadius:10,fontSize:18,fontFamily:"inherit",outline:"none",textAlign:"center",letterSpacing:6,marginBottom:10,transition:"all 0.2s"}}
        />
        {err && <div style={{color:"#f87171",fontSize:13,marginBottom:8}}>❌ Password errata</div>}
        <button onClick={check} style={{width:"100%",background:"#dc2626",border:"none",color:"#fff",padding:16,borderRadius:10,cursor:"pointer",fontFamily:"inherit",fontSize:17,fontWeight:900,marginTop:6,letterSpacing:1}}>
          ENTRA →
        </button>
      </div>
    </div>
  );
}

/* ── POS ── */
function POS({ theme, toggleTheme }) {
  const [cart, setCart]     = useState([]);
  const [view, setView]     = useState("cassa"); // cassa | carrello | scontrino | report | impostazioni
  const [cat, setCat]       = useState("Tutti");
  const [orders, setOrders] = useState(() => { try { return JSON.parse(localStorage.getItem(EVENT_PREFIX+"orders")||"[]"); } catch{return[];} });
  const [lastR, setLastR]   = useState(null);
  const [rcptIdx, setRcptIdx] = useState(0);
  const [autoPrint, setAutoPrint] = useState(false);

  useEffect(() => {
    if (autoPrint && view === "scontrino" && lastR) {
      const t = setTimeout(() => { window.print(); setAutoPrint(false); }, 500);
      return () => clearTimeout(t);
    }
  }, [autoPrint, view, lastR, rcptIdx]);
  const [synced, setSynced] = useState(false);
  const [syncStatus, setSyncStatus] = useState("local"); // local | connected | error
  const [processing, setProcessing] = useState(false); // blocca doppio incasso

  // Persistenza ordini su localStorage "throttled": evita di serializzare l'intera
  // lista in modo sincrono a ogni nuovo ordine (causa di blocchi sotto carico).
  const persistTimer  = useRef(null);
  const pendingOrders = useRef(null);
  const persistOrders = (arr) => {
    pendingOrders.current = arr;
    if (persistTimer.current) return;
    persistTimer.current = setTimeout(() => {
      persistTimer.current = null;
      try { localStorage.setItem(EVENT_PREFIX+"orders", JSON.stringify(pendingOrders.current)); } catch (e) {}
    }, 4000);
  };
  useEffect(() => {
    const flush = () => { try { if (pendingOrders.current) localStorage.setItem(EVENT_PREFIX+"orders", JSON.stringify(pendingOrders.current)); } catch (e) {} };
    window.addEventListener("pagehide", flush);
    window.addEventListener("beforeunload", flush);
    return () => { window.removeEventListener("pagehide", flush); window.removeEventListener("beforeunload", flush); };
  }, []);

  // Firebase sync
  useEffect(() => {
    if (!db) { setSyncStatus("local"); return; }
    setSyncStatus("connecting");
    const ref = db.ref(DB_ROOT+"/orders");
    const handler = snap => {
      const val = snap.val();
      if (val) {
        const arr = Object.entries(val).map(([k,v])=>({...v,_key:k})).sort((a,b)=>a.id-b.id);
        setOrders(arr);
        persistOrders(arr);
        // Tiene il contatore locale sempre avanti rispetto al massimo id già su Firebase
        if (arr.length) { const maxId = arr[arr.length-1].id || 0; if (maxId + 1 > rcptN) rcptN = maxId + 1; }
      } else {
        setOrders([]);
      }
      setSynced(true);
      setSyncStatus("connected");
    };
    ref.on("value", handler, () => setSyncStatus("error"));
    return () => ref.off("value", handler);
  }, []);

  // Comande (cucina)
  const [comande, setComande] = useState([]);
  useEffect(() => {
    if (!db) return;
    const ref = db.ref(DB_ROOT+"/comande");
    const handler = snap => {
      const val = snap.val();
      if (val) {
        const arr = Object.entries(val).map(([k,v])=>({...v,_key:k})).sort((a,b)=>a.id-b.id);
        setComande(arr);
      } else {
        setComande([]);
      }
    };
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  // Menu state (editabile + sincronizzato)
  const [menu, setMenu] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem(EVENT_PREFIX+"menu")||"null");
      // Un menu svuotato di proposito resta vuoto: solo l'assenza di dati richiama i default
      return Array.isArray(saved) ? saved : DEFAULT_MENU;
    } catch { return DEFAULT_MENU; }
  });

  // Firebase sync per il menu
  useEffect(() => {
    if (!db) return;
    const ref = db.ref(DB_ROOT+"/menu");
    const handler = snap => {
      const val = snap.val();
      if (val && Array.isArray(val) && val.length) {
        setMenu(val);
        localStorage.setItem(EVENT_PREFIX+"menu", JSON.stringify(val));
      }
    };
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);

  const saveMenu = (newMenu) => {
    setMenu(newMenu);
    localStorage.setItem(EVENT_PREFIX+"menu", JSON.stringify(newMenu));
    if (db) db.ref(DB_ROOT+"/menu").set(newMenu);
  };

  // Centri di costo (struttura + stampa), locali e sincronizzati su tutte le casse
  const [centri, setCentri] = useState(() => {
    try { return fixCentri(JSON.parse(localStorage.getItem(EVENT_PREFIX+"centri")||"null")); }
    catch { return fixCentri(null); }
  });
  useEffect(() => {
    if (!db) return;
    const ref = db.ref(DB_ROOT+"/config/centri");
    const handler = snap => {
      const val = snap.val();
      if (Array.isArray(val) && val.length) {
        const fixed = fixCentri(val);
        setCentri(fixed);
        localStorage.setItem(EVENT_PREFIX+"centri", JSON.stringify(fixed));
      }
    };
    ref.on("value", handler);
    return () => ref.off("value", handler);
  }, []);
  const saveCentri = (arr) => {
    const fixed = fixCentri(arr);
    setCentri(fixed);
    localStorage.setItem(EVENT_PREFIX+"centri", JSON.stringify(fixed));
    if (db) db.ref(DB_ROOT+"/config/centri").set(fixed);
  };
  const CATEGORIE = React.useMemo(() => catsDi(centri), [centri]);

  // Configurazione scontrino (locale + sincronizzata su tutte le casse)
  const [rcptCfg, setRcptCfg] = useState(() => {
    try { return {...DEFAULT_RCPT, ...(JSON.parse(localStorage.getItem(EVENT_PREFIX+"rcpt_cfg")||"{}"))}; }
    catch { return {...DEFAULT_RCPT}; }
  });
  useEffect(() => {
    if (!db) return;
    const ref = db.ref(DB_ROOT+"/config/scontrino");

  const confirmNote = () => {
    const item = noteItem;
    if (!item) return;
    const note = noteText.trim();
    let uid = item.id * 1000000;
    if (note) {
      let h = 0;
      for (let k = 0; k < note.length; k++) { h = (h * 31 + note.charCodeAt(k)) % 900000; }
      uid = item.id * 1000000 + 100000 + h;
    }
    _pushToCart({ id: uid, name: item.name, price: item.price, cat: item.cat, note });
    setNoteItem(null); setNoteText("");

  const confirmVariants = () => {
    const item = variantPick;
    if (!item) return;
    // Nessuna opzione scelta → aggiunge l'articolo base
    if (variantSel.length === 0) {
      _pushToCart({ id:item.id, name:item.name, price:item.price, cat:item.cat });
      setVariantPick(null); setVariantSel([]); return;
    }
    // Ordina le opzioni secondo l'ordine originale (id coerente a parità di combinazione)
    const ordered = item.variants.filter(v => variantSel.includes(v));
    // id univoco per combinazione tramite bitmask degli indici scelti
    let mask = 0;
    ordered.forEach(v => { mask += Math.pow(2, item.variants.indexOf(v)); });
    const label = ordered.join(", ");
    const variantItem = {
      id: item.id * 1000000 + mask,
      name: item.name + " (" + label + ")",
      price: item.price,
      cat: item.cat,
      variant: label,
    };
    _pushToCart(variantItem);
    setVariantPick(null); setVariantSel([]);

  const openDrawer = () => {

    html.classList.add("printing-drawer");
    const cleanup = () => { html.classList.remove("printing-drawer"); window.removeEventListener("afterprint", cleanup); };
    window.addEventListener("afterprint", cleanup);
    setTimeout(() => { try { window.print(); } catch (e) {} }, 50);
    setTimeout(cleanup, 4000); // fallback se "afterprint" non scatta (es. iOS)
  };


  // Stampa automatica in sequenza di tutti gli scontrini dell'ultimo ordine.
  // window.print() è bloccante in modalità finestra di dialogo: dopo che torna,
  // passiamo allo scontrino successivo. In modalità chiosco (stampa silenziosa)
  // i lavori vengono accodati con un piccolo intervallo tra l'uno e l'altro.
  // Stampa manuale del solo scontrino a video: rispetta le copie del suo centro,
  // ma ne stampa comunque almeno una (il tasto è stato premuto apposta).
  const printCurrent = (r) => {
    const membri = r && r.gruppo ? centri.filter(c => c.gruppo === r.gruppo) : [];
    const n = Math.max(1, copieGruppo(membri));
    const step = (c) => {
      try { window.print(); } catch (e) {}
      if (c + 1 < n) setTimeout(() => step(c + 1), 400);
    };
    step(0);
  };

  // Costruisce la coda di stampa: ogni scontrino viene ripetuto tante volte
  // quante ne prevede il suo centro di costo (0 = saltato del tutto).
  const printAllReceipts = (receipts) => {
    if (!receipts || !receipts.length) return;
    const coda = [];
    receipts.forEach((r, k) => {
      const membri = r.gruppo ? centri.filter(c => c.gruppo === r.gruppo) : [];
      const n = r.gruppo ? copieGruppo(membri) : 1;
      for (let c = 0; c < n; c++) coda.push(k);
    });
    if (!coda.length) return;
    const step = (i) => {
      setRcptIdx(coda[i]);
      setTimeout(() => {
        try { window.print(); } catch (e) {}
        if (i + 1 < coda.length) setTimeout(() => step(i + 1), 400);
      }, 500); // attende il render del nuovo scontrino
    };
    step(0);
  };

  const checkout = () => {
    if (!cart.length) return;
    // Il nome serve solo se c'è del cibo (genera la comanda in cucina).
    // Per ordini di solo bere (BAR) non è obbligatorio.
    // "cibo" = tutto ciò che passa da una stazione di preparazione
    const hasFood = cart.some(i => { const c = centroDi(centri, i.cat); return c && c.comanda; });
    const nomeServe = rcptCfg.nomeRichiesto === "sempre" || (rcptCfg.nomeRichiesto === "cibo" && hasFood);
    if (nomeServe && !table.trim()) {
      alert("Inserisci " + rcptCfg.etichettaNome.toLowerCase() + ": è obbligatorio con le impostazioni attuali.");
      return;
    }
    if (processing) return;          // evita doppio tap / doppio incasso
    setProcessing(true);

    const now = new Date().toLocaleString("it-IT");
    const nomeBase = table.trim();
    const escNome = nomeBase.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    // Cerca comande non evase con lo stesso nome (o con suffisso "Nome N")
    const attive = comande.filter(c => !c.evasa);
    const regex = new RegExp("^" + escNome + "( \\d+)?$", "i");
    const conflitti = attive.filter(c => c.cliente && regex.test(c.cliente));
    let clienteFinale = nomeBase;
    if (conflitti.length > 0) {
      let maxN = 1;
      conflitti.forEach(c => {
        const match = c.cliente.match(new RegExp("^" + escNome + " (\\d+)$", "i"));
        if (match) { const n = parseInt(match[1]); if (n > maxN) maxN = n; }
      });
      clienteFinale = nomeBase + " " + (maxN + 1);
    }

    // Uno scontrino per ogni gruppo di stampa: i centri uniti finiscono insieme
    const gruppi = gruppiDi(centri).map(g => ({
      gruppo: g.gruppo,
      centro: labelGruppo(g.centri),
      items: cart.filter(i => g.centri.some(c => c.cats.includes(i.cat))),
    })).filter(g => g.items.length);
    // Articoli di categorie orfane (nessun centro): finiscono sul primo scontrino
    const coperte = new Set(catsDi(centri));
    const orfani = cart.filter(i => !coperte.has(i.cat));
    if (orfani.length) {
      if (gruppi.length) gruppi[0].items = [...gruppi[0].items, ...orfani];
      else gruppi.push({ gruppo: centri[0] ? centri[0].gruppo : "x", centro: labelGruppo([centri[0]].filter(Boolean)), items: orfani });
    }
    const nReceipts = gruppi.length;
    if (!nReceipts) { setProcessing(false); return; }

    // Costruisce e salva gli scontrini a partire dal primo numero assegnato
    const finishCheckout = (firstId) => {
      let n = firstId;
      const receipts = [];
      const makeReceipt = (items, centro, gruppo) => {
        const sub  = items.reduce((s,i)=>s+i.price*i.qty,0);
        const dAmt = sub*(disc/100);
        return { id: n++, date: now, items, subtotal: sub, disc, discAmt: dAmt, total: sub - dAmt, pay, table: clienteFinale, centro, gruppo };
      };
      gruppi.forEach(g => receipts.push(makeReceipt(g.items, g.centro, g.gruppo)));

      // COMANDE per la cucina — la PIZZA va su una comanda separata rispetto a cibo/fritti
      const pushComanda = (items, centro, receiptId) => {
        if (!items.length || !db) return;
        db.ref(DB_ROOT+"/comande").push({
          id: receiptId,
          date: now,
          cliente: clienteFinale,
          centro,
          items: items.map((it, idx) => ({ uid: idx, name: it.name, variant: it.variant || null, note: it.note || null, qty: it.qty, done: false })),
          stato: "attesa",
          evasa: false,
        });
      };
      // Una comanda per ogni stazione di preparazione: i centri che condividono
      // la stessa stazione (es. cibo e fritti in cucina) finiscono sulla stessa.
      const stazioni = [];
      centri.filter(c => c.comanda).forEach(c => {
        const st = stazioni.find(x => x.nome === c.stazione);
        if (st) st.centri.push(c); else stazioni.push({ nome: c.stazione, centri: [c] });
      });
      stazioni.forEach(st => {
        const items = cart.filter(i => st.centri.some(c => c.cats.includes(i.cat)));
        if (!items.length) return;
        const rec = receipts.find(r => st.centri.some(c => c.gruppo === r.gruppo));
        pushComanda(items, st.nome, rec ? rec.id : firstId);
      });

      rcptN = n;
      localStorage.setItem(EVENT_PREFIX+"rcpt_n", rcptN);

      receipts.forEach(r => {
        if (db) {
          db.ref(DB_ROOT+"/orders").push(r).catch(()=>{
            const no=[...orders,...receipts];
            setOrders(no);
            localStorage.setItem(EVENT_PREFIX+"orders",JSON.stringify(no));
          });
        } else {
          const no=[...orders,...receipts];
          setOrders(no);
          localStorage.setItem(EVENT_PREFIX+"orders",JSON.stringify(no));
        }
      });

      setLastR(receipts);
      setRcptIdx(0);
      clearCart();
      setView("scontrino");
      setProcessing(false);
      if (rcptCfg.autoStampa) printAllReceipts(receipts);
    };

    if (db) {
      // Numerazione globale e atomica: riserva nReceipts numeri sul contatore condiviso
      const maxExisting = orders.reduce((m,o)=>Math.max(m, o.id||0), 0);
      let done = false;
      const fallbackTimer = setTimeout(() => {
        if (done) return; done = true;
        finishCheckout(Math.max(rcptN, maxExisting + 1));
      }, 2500);
      db.ref(DB_ROOT+"/counter").transaction(cur => {
        const base = (typeof cur === "number" && cur >= maxExisting) ? cur : maxExisting;
        return base + nReceipts;
      }).then(res => {
        if (done) return; done = true; clearTimeout(fallbackTimer);
        const committed = (res && res.snapshot) ? res.snapshot.val() : null;
        const firstId = (typeof committed === "number") ? (committed - nReceipts + 1) : Math.max(rcptN, maxExisting + 1);
        finishCheckout(firstId);
      }).catch(() => {
        if (done) return; done = true; clearTimeout(fallbackTimer);
        finishCheckout(Math.max(rcptN, maxExisting + 1));
      });
    } else {
      finishCheckout(rcptN);
    }
  };

  // Modale per inserire una nota libera sulla pizza (condivisa mobile + desktop)
  const noteModalJSX = noteItem && (
    <div onClick={()=>{setNoteItem(null);setNoteText("");}} style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.75)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div onClick={e=>e.stopPropagation()} style={{background:"#1e293b",border:"1px solid #334155",borderRadius:16,padding:20,maxWidth:380,width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,0.5)"}}>
        <div style={{fontSize:18,fontWeight:800,color:"#f8fafc",marginBottom:6,letterSpacing:"-0.3px"}}>🍕 {noteItem.name}</div>
        <div style={{fontSize:13,color:"#94a3b8",marginBottom:14}}>Aggiungi una nota per la cucina (es. senza cipolla, base bianca…). Lascia vuoto se non serve.</div>
        {noteItem.variants && noteItem.variants.length > 0 && (
          <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:12}}>
            {noteItem.variants.map(v => (
              <button key={v} onClick={()=>setNoteText(t => t ? t+", "+v : v)} style={{background:"#0f172a",border:"1px solid #334155",color:"#e2e8f0",padding:"6px 10px",borderRadius:16,cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>+ {v}</button>
            ))}
          </div>
        )}
        <textarea value={noteText} onChange={e=>setNoteText(e.target.value)} autoFocus rows={3} placeholder="Es. senza cipolla" style={{width:"100%",background:"#0f172a",border:"1px solid #334155",color:"#e2e8f0",padding:"12px",borderRadius:10,fontSize:15,fontFamily:"inherit",outline:"none",resize:"vertical",boxSizing:"border-box"}} />
        <div style={{display:"flex",gap:10,marginTop:16}}>
          <button onClick={()=>{setNoteItem(null);setNoteText("");}} style={{flex:1,background:"transparent",border:"1px solid #334155",color:"#94a3b8",padding:"12px",borderRadius:10,cursor:"pointer",fontFamily:"inherit",fontSize:14}}>Annulla</button>
          <button onClick={confirmNote} style={{flex:2,background:"#dc2626",border:"none",color:"#fff",padding:"12px",borderRadius:10,cursor:"pointer",fontFamily:"inherit",fontSize:15,fontWeight:700}}>✓ Aggiungi</button>
        </div>
      </div>
    </div>
  );

  /* ── MOBILE LAYOUT ── */
  if (isMobile) return (
    <div className="app-shell" style={{display:"flex",flexDirection:"column",background:"#0f172a",color:"#e2e8f0",fontFamily:"inherit",overflow:"hidden"}}>

      {/* Microstampa nascosta per apertura cassetto */}
      <div id="drawer-print" style={{position:"fixed",left:"-9999px",top:0,visibility:"hidden",textAlign:"center",fontFamily:"'JetBrains Mono','Courier New',monospace",fontSize:12,fontWeight:700}}>APERTURA CASSETTO</div>

      {/* MODAL SELETTORE VARIANTI */}
      {variantPick && (
        <div onClick={()=>setVariantPick(null)} style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.75)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"#1e293b",border:"1px solid #334155",borderRadius:16,padding:20,maxWidth:380,width:"100%",maxHeight:"88dvh",display:"flex",flexDirection:"column",boxShadow:"0 20px 60px rgba(0,0,0,0.5)"}}>
            <div style={{fontSize:18,fontWeight:800,color:"#f8fafc",marginBottom:6,letterSpacing:"-0.3px",flexShrink:0}}>{variantPick.name}</div>
            <div style={{fontSize:13,color:"#94a3b8",marginBottom:16,flexShrink:0}}>Scegli le opzioni — puoi selezionarne più di una, poi premi Fatto</div>
            <div style={{display:"flex",flexDirection:"column",gap:10,overflowY:"auto",minHeight:0,flex:"1 1 auto",margin:"0 -4px",padding:"4px"}}>
              {variantPick.variants.map(v => {
                const on = variantSel.includes(v);
                return (
                  <button key={v} onClick={()=>toggleVariant(v)} style={{background:on?"#7f1d1d":"#0f172a",border:"1px solid "+(on?"#dc2626":"#334155"),color:on?"#fff":"#e2e8f0",padding:"14px 16px",borderRadius:10,cursor:"pointer",fontFamily:"inherit",fontSize:15,fontWeight:600,textAlign:"left",display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
                    <span>{v}</span>
                    <span style={{fontSize:16,opacity:on?1:0.3}}>{on?"\u2713":"\u25cb"}</span>
                  </button>
                );
              })}
            </div>
            <div style={{display:"flex",gap:10,marginTop:16,flexShrink:0}}>
              <button onClick={()=>{setVariantPick(null);setVariantSel([]);}} style={{flex:1,background:"transparent",border:"1px solid #334155",color:"#94a3b8",padding:"12px",borderRadius:10,cursor:"pointer",fontFamily:"inherit",fontSize:14}}>
                Annulla
              </button>
              <button onClick={confirmVariants} style={{flex:2,background:"#dc2626",border:"none",color:"#fff",padding:"12px",borderRadius:10,cursor:"pointer",fontFamily:"inherit",fontSize:15,fontWeight:700}}>
                {"\u2713 Fatto"}{variantSel.length>0?" ("+variantSel.length+")":""}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* MODALE NOTA PIZZA */}
      {noteModalJSX}

      {/* TOP BAR */}
      <div style={{background:"#1e293b",padding:"10px 14px",display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:"1px solid #334155",flexShrink:0}}>
        <div style={{display:"flex",flexDirection:"column"}}>
          <div style={{fontSize:16,fontWeight:800,color:"#f8fafc",letterSpacing:"-0.3px",display:"flex",alignItems:"center",gap:8}}><Logo size={26}/>{EVT.nomeBreve}</div>
          <div style={{fontSize:10,color:syncStatus==="connected"?"#4ade80":syncStatus==="connecting"?"#fbbf24":"#64748b"}}>
            {syncStatus==="connected"?"🟢 Sincronizzato":syncStatus==="connecting"?"🟡 Connessione...":syncStatus==="error"?"🔴 Errore sync":"⚫ Solo locale"}
          </div>
        </div>
        <div style={{display:"flex",gap:6}}>
          {[["cassa","🧾"],["cucina","🧑‍🍳"],["report","📊"],["articoli","🍔"],["impostazioni","⚙️"]].map(([v,ic])=>(
            <button key={v} onClick={()=>setView(v)} style={{background:view===v?"#dc2626":"#334155",border:"none",color:"#fff",width:38,height:38,borderRadius:10,fontSize:18,cursor:"pointer"}}>
              {ic}
            </button>
          ))}
          <button onClick={toggleTheme} title="Cambia tema" style={{background:"#334155",border:"none",color:"#fff",width:38,height:38,borderRadius:10,fontSize:18,cursor:"pointer"}}>
            {theme==="dark"?"☀️":"🌙"}
          </button>
        </div>
      </div>

      {/* FLASH */}
      {flash && <div style={{position:"fixed",top:60,left:"50%",transform:"translateX(-50%)",background:"#22c55e",color:"#fff",padding:"8px 20px",borderRadius:20,fontWeight:900,zIndex:999,fontSize:14,whiteSpace:"nowrap"}}>
        {flash}
      </div>}

      {/* ── CASSA VIEW MOBILE ── */}
      {(view==="cassa"||view==="carrello") && (
        <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",minHeight:0}}>

          {/* Tab switcher: Menù / Carrello */}
          <div style={{display:"flex",background:"#0f172a",borderBottom:"1px solid #334155",flexShrink:0}}>
            <button onClick={()=>setView("cassa")} style={{flex:1,padding:"10px",background:view==="cassa"?"#1e293b":"transparent",border:"none",color:view==="cassa"?"#f8fafc":"#64748b",fontFamily:"inherit",fontSize:13,fontWeight:700,borderBottom:view==="cassa"?"2px solid #dc2626":"2px solid transparent",cursor:"pointer"}}>
              🍽 Menù
            </button>
            <button onClick={()=>setView("carrello")} style={{flex:1,padding:"10px",background:view==="carrello"?"#1e293b":"transparent",border:"none",color:view==="carrello"?"#f8fafc":"#64748b",fontFamily:"inherit",fontSize:13,fontWeight:700,borderBottom:view==="carrello"?"2px solid #dc2626":"2px solid transparent",cursor:"pointer",position:"relative"}}>
              🛒 Carrello {cartCount>0&&<span style={{background:"#dc2626",color:"#fff",borderRadius:10,padding:"1px 7px",fontSize:11,marginLeft:4}}>{cartCount}</span>}
            </button>
          </div>

          {/* MENÙ TAB */}
          {view==="cassa" && (
            <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",minHeight:0}}>
              {/* Search */}
              <div style={{padding:"8px 10px",flexShrink:0,display:"flex",gap:8}}>
                <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Cerca..." style={{flex:1,minWidth:0,background:"#1e293b",border:"1px solid #334155",color:"#e2e8f0",padding:"10px 14px",borderRadius:10,fontSize:14,fontFamily:"inherit",outline:"none"}} />
                <button onClick={openDrawer} title="Apri cassetto" style={{flexShrink:0,width:48,background:"#334155",border:"1px solid #475569",color:"#fff",borderRadius:10,cursor:"pointer",fontSize:20}}>💶</button>
              </div>
              {/* Category pills */}
              <div style={{display:"flex",gap:6,padding:"0 10px 8px",overflowX:"auto",flexShrink:0,scrollbarWidth:"none"}}>
                {CATS.map(c=>(
                  <button key={c} onClick={()=>setCat(c)} style={{background:cat===c?"#dc2626":"#1e293b",border:`1px solid ${cat===c?"#dc2626":"#334155"}`,color:cat===c?"#fff":"#94a3b8",padding:"7px 14px",borderRadius:20,cursor:"pointer",fontSize:12,fontFamily:"inherit",whiteSpace:"nowrap",flexShrink:0}}>
                    {c}
                  </button>
                ))}
              </div>
              {/* Product grid */}
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,padding:"0 10px 10px",overflowY:"auto",flex:1,minHeight:0}}>
                {filtered.map(item=>(
                  <button key={item.id} onClick={()=>addItem(item)} style={{background:"#1e293b",border:"1px solid #334155",borderRadius:12,padding:"14px 8px",cursor:"pointer",textAlign:"center",color:"#e2e8f0",fontFamily:"inherit",display:"flex",flexDirection:"column",alignItems:"center",gap:4,minHeight:72,active:{background:"#dc2626"}}}>
                    <div style={{fontSize:12,fontWeight:700,lineHeight:1.25,color:"#f1f5f9"}}>{item.name}</div>
                    <div style={{fontSize:16,color:"#f87171",fontWeight:900,marginTop:3}}>{fmt(item.price)}</div>
                  </button>
                ))}
              </div>
            </div>
          )}

          {/* CARRELLO TAB */}
          {view==="carrello" && (
            <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",minHeight:0}}>
              {/* Table input */}
              <div style={{padding:"8px 10px",flexShrink:0}}>
                <input value={table} onChange={e=>setTable(e.target.value)} placeholder="👤 Nome cliente (solo se c'è cibo)" style={{width:"100%",background:"#1e293b",border:"1px solid #334155",color:"#e2e8f0",padding:"10px 14px",borderRadius:10,fontSize:14,fontFamily:"inherit",outline:"none"}} />
              </div>
              {/* Cart items */}
              <div style={{flex:1,overflowY:"auto",minHeight:0,padding:"0 10px"}}>
                {!cart.length && (
                  <div style={{textAlign:"center",color:"#475569",padding:"40px 0",fontSize:15}}>
                    Nessun articolo<br/><span style={{fontSize:36}}>🛒</span>
                  </div>
                )}
                {cart.map(item=>(
                  <div key={item.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderBottom:"1px solid #1e293b"}}>
                    <div style={{flex:1}}>
                      <div style={{fontSize:13,color:"#e2e8f0",fontWeight:600}}>{item.name}</div>
                      {item.note && <div style={{fontSize:11,color:"#fbbf24",fontStyle:"italic",marginTop:2}}>📝 {item.note}</div>}
                    </div>
                    <button onClick={()=>remItem(item.id)} style={{background:"#334155",border:"none",color:"#e2e8f0",width:32,height:32,borderRadius:8,cursor:"pointer",fontSize:18,fontFamily:"inherit"}}>−</button>
                    <span style={{width:24,textAlign:"center",fontWeight:900,fontSize:16}}>{item.qty}</span>
                    <button onClick={()=>addItem(item)} style={{background:"#334155",border:"none",color:"#e2e8f0",width:32,height:32,borderRadius:8,cursor:"pointer",fontSize:18,fontFamily:"inherit"}}>+</button>
                    <div style={{fontSize:14,fontWeight:900,color:"#f87171",minWidth:55,textAlign:"right"}}>{fmt(item.price*item.qty)}</div>
                  </div>
                ))}
              </div>

              {/* Footer con totale e pagamento */}
              {cart.length>0 && (
                <div style={{background:"#131f30",borderTop:"1px solid #334155",padding:"12px 14px 16px",paddingBottom:"calc(16px + env(safe-area-inset-bottom))",flexShrink:0}}>
                  {/* Sconto */}
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
                    <span style={{color:"#94a3b8",fontSize:13}}>Sconto %</span>
                    <input type="number" min="0" max="100" value={disc} onChange={e=>setDisc(Math.min(100,Math.max(0,+e.target.value)))} style={{background:"#1e293b",border:"1px solid #334155",color:"#e2e8f0",padding:"4px 8px",borderRadius:6,width:64,textAlign:"center",fontSize:14,fontFamily:"inherit",outline:"none"}} />
                  </div>
                  {disc>0&&<div style={{display:"flex",justifyContent:"space-between",fontSize:13,color:"#94a3b8",marginBottom:4}}><span>Subtotale</span><span>{fmt(subtotal)}</span></div>}
                  {disc>0&&<div style={{display:"flex",justifyContent:"space-between",fontSize:13,color:"#f87171",marginBottom:4}}><span>Sconto -{disc}%</span><span>−{fmt(discAmt)}</span></div>}
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:22,fontWeight:900,color:"#4ade80",marginBottom:12}}>
                    <span>TOTALE</span><span>{fmt(total)}</span>
                  </div>
                  {/* Payment methods */}
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
                    {[["contanti","💵"],["carta","💳"],["pos","📱"],["ticket","🎫"]].map(([m,ic])=>(
                      <button key={m} onClick={()=>setPay(m)} style={{background:pay===m?"#991b1b":"#1e293b",border:`2px solid ${pay===m?"#dc2626":"#334155"}`,color:pay===m?"#fff":"#94a3b8",padding:"10px",borderRadius:10,cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:700,textTransform:"capitalize"}}>
                        {ic} {m}
                      </button>
                    ))}
                  </div>
                  {/* Actions */}
                  <div style={{display:"flex",gap:8}}>
                    <button onClick={clearCart} style={{flex:1,background:"#7f1d1d",border:"none",color:"#fca5a5",padding:"13px",borderRadius:10,cursor:"pointer",fontFamily:"inherit",fontSize:14,fontWeight:700}}>
                      🗑 Cancella
                    </button>
                    <button onClick={checkout} disabled={processing} style={{flex:2,background:processing?"#166534":"#15803d",border:"none",color:"#fff",padding:"13px",borderRadius:10,cursor:processing?"wait":"pointer",opacity:processing?0.6:1,fontFamily:"inherit",fontSize:15,fontWeight:900}}>
                      {processing ? "⏳ Attendi…" : <>✅ Incassa {fmt(total)}</>}
                    </button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      )}

      {/* ── SCONTRINO MOBILE ── */}
      {view==="scontrino" && lastR && (()=>{
        const receipts = Array.isArray(lastR) ? lastR : [lastR];
        const r = receipts[rcptIdx];
        const isLast = rcptIdx >= receipts.length - 1;
        const hasMultiple = receipts.length > 1;
        return (
        <div style={{flex:1,overflowY:"auto",padding:16,display:"flex",flexDirection:"column",alignItems:"center"}}>
          {hasMultiple && (
            <div style={{width:"100%",maxWidth:320,marginBottom:12,display:"flex",gap:6}}>
              {receipts.map((rec,i)=>(
                <button key={i} onClick={()=>setRcptIdx(i)} style={{flex:1,padding:"8px",borderRadius:8,border:"none",cursor:"pointer",fontFamily:"inherit",fontSize:12,fontWeight:700,background:rcptIdx===i?"#dc2626":"#334155",color:"#fff"}}>
                  {rec.centro}
                </button>
              ))}
            </div>
          )}
          <div id="receipt-print" style={{background:"#fff",color:"#000",width:"100%",maxWidth:320,padding:20,borderRadius:8,fontFamily:"'JetBrains Mono','Courier New',monospace",fontSize:rcptCfg.fontBase,fontWeight:700}}>
            <ReceiptBody r={r} cfg={rcptCfg} />
          </div>
          <div style={{display:"flex",gap:10,marginTop:16,width:"100%",maxWidth:320}}>
            <button onClick={()=>printCurrent(r)} style={{flex:1,background:"#1e293b",border:"1px solid #334155",color:"#e2e8f0",padding:"13px",borderRadius:10,cursor:"pointer",fontFamily:"inherit",fontSize:14,fontWeight:700}}>🖨 Stampa</button>
            {!isLast
              ? <button onClick={()=>{setRcptIdx(rcptIdx+1);setAutoPrint(true);}} style={{flex:2,background:"#dc2626",border:"none",color:"#fff",padding:"13px",borderRadius:10,cursor:"pointer",fontFamily:"inherit",fontSize:14,fontWeight:900}}>Prossimo →</button>
              : <button onClick={()=>setView("cassa")} style={{flex:2,background:"#15803d",border:"none",color:"#fff",padding:"13px",borderRadius:10,cursor:"pointer",fontFamily:"inherit",fontSize:14,fontWeight:900}}>➕ Nuovo Ordine</button>
            }
          </div>
        </div>
        );
      })()}

      {/* ── REPORT MOBILE ── */}
      {view==="report" && (
        <div style={{flex:1,overflowY:"auto",padding:"12px 10px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <div style={{fontSize:18,fontWeight:900,color:"#f8fafc"}}>📊 Report</div>
            <button onClick={exportExcel} style={{background:"#15803d",border:"none",color:"#fff",padding:"8px 14px",borderRadius:8,cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:700}}>📥 Excel</button>
          </div>
          {/* Selettore giornata */}
          <div style={{marginBottom:14}}>
            <select value={reportDay} onChange={e=>setReportDay(e.target.value)} style={{width:"100%",background:"#1e293b",border:"1px solid #334155",color:"#e2e8f0",padding:"10px 12px",borderRadius:10,fontSize:14,fontFamily:"inherit",outline:"none"}}>
              <option value="all">📅 Tutte le giornate</option>
              {reportDays.map(d=><option key={d} value={d}>{d}</option>)}
            </select>
          </div>
          {/* Stat cards */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
            {[[reportDay==="all"?"Incasso":"Giornata",fmt(scopeRev),scopeO.length+" scontrini"],["Media",scopeO.length?fmt(scopeRev/scopeO.length):"€0.00","per scontrino"],[EVT.totaleLabel,fmt(totalRev),orders.length+" scontrini"]].map(([l,v,s])=>(
              <div key={l} style={{background:"#1e293b",borderRadius:10,padding:"12px 14px",border:"1px solid #334155",gridColumn:l===EVT.totaleLabel?"span 2":"auto"}}>
                <div style={{fontSize:11,color:"#64748b",textTransform:"uppercase",letterSpacing:1,marginBottom:4}}>{l}</div>
                <div style={{fontSize:22,fontWeight:900,color:"#4ade80"}}>{v}</div>
                <div style={{fontSize:11,color:"#64748b",marginTop:2}}>{s}</div>
              </div>
            ))}
          </div>
          {/* Top prodotti */}
          <div style={{background:"#1e293b",borderRadius:10,padding:"14px",border:"1px solid #334155",marginBottom:10}}>
            <div style={{fontSize:14,fontWeight:700,color:"#f8fafc",marginBottom:10}}>🏆 Top Prodotti</div>
            {!topItems.length&&<div style={{color:"#64748b",fontSize:13}}>Nessun dato</div>}
            {topItems.map(([name,qty],i)=>(
              <div key={name} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:"1px solid #334155"}}>
                <span style={{color:"#64748b",fontSize:12,width:20}}>#{i+1}</span>
                <span style={{flex:1,fontSize:13}}>{name}</span>
                <span style={{fontWeight:700,color:"#fbbf24",fontSize:13}}>{qty} pz</span>
              </div>
            ))}
          </div>
          {/* Ultimi scontrini */}
          <div style={{background:"#1e293b",borderRadius:10,padding:"14px",border:"1px solid #334155",marginBottom:10}}>
            <div style={{fontSize:14,fontWeight:700,color:"#f8fafc",marginBottom:10}}>🧾 Scontrini {reportDay==="all"?"(ultimi 50)":"· "+reportDay}</div>
            {!scopeO.length&&<div style={{color:"#64748b",fontSize:13}}>Nessun ordine</div>}
            {[...scopeO].reverse().slice(0,reportDay==="all"?50:99999).map(o=>(
              <div key={o.id} style={{padding:"8px 0",borderBottom:"1px solid #334155"}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{color:"#64748b",fontSize:11}}>{String(o.id).padStart(4,"0")}</span>
                  <div style={{flex:1}}>
                    <div style={{fontSize:12,color:"#e2e8f0"}}>{o.date}</div>
                    <div style={{fontSize:11,color:"#64748b",textTransform:"capitalize"}}>{o.pay} {o.table?"· "+o.table:""}</div>
                  </div>
                  <span style={{fontWeight:900,color:"#4ade80",fontSize:14}}>{fmt(o.total)}</span>
                </div>
                <div style={{display:"flex",gap:6,marginTop:6}}>
                  <button onClick={()=>editOrder(o)} style={{flex:1,background:"#1d4ed8",border:"none",color:"#fff",padding:"6px",borderRadius:6,cursor:"pointer",fontFamily:"inherit",fontSize:11,fontWeight:700}}>✏️ Modifica</button>
                  <button onClick={()=>deleteOrder(o)} style={{flex:1,background:"#7f1d1d",border:"none",color:"#fca5a5",padding:"6px",borderRadius:6,cursor:"pointer",fontFamily:"inherit",fontSize:11,fontWeight:700}}>🗑 Annulla</button>
                </div>
              </div>
            ))}
          </div>
          <div style={{textAlign:"center",paddingBottom:20}}>
            <button onClick={deleteAllOrders} style={{background:"#7f1d1d",border:"1px solid #991b1b",color:"#fca5a5",padding:"10px 20px",borderRadius:8,cursor:"pointer",fontFamily:"inherit",fontSize:13}}>
              🗑 Azzera Dati
            </button>
          </div>
        </div>
      )}

      {/* ── CUCINA MOBILE ── */}
      {view==="cucina" && (
        <div style={{flex:1,overflowY:"auto",padding:"12px 10px"}}>
          <CucinaView comande={comande} toggleComandaItem={toggleComandaItem} evadiComanda={evadiComanda} consegnaScontrino={consegnaScontrino} deleteComanda={deleteComanda} archiviaComanda={archiviaComanda} riportaInAttesa={riportaInAttesa} svuotaStorico={svuotaStorico} isMobile={true} />
        </div>
      )}

      {/* ── ARTICOLI MOBILE ── */}
      {view==="articoli" && (
        <div style={{flex:1,overflowY:"auto",padding:"12px 10px"}}>
          <ArticoliManager menu={menu} saveMenu={saveMenu} centri={centri} saveCentri={saveCentri} isMobile={true} />
        </div>
      )}

      {/* ── IMPOSTAZIONI MOBILE ── */}
      {view==="impostazioni" && (
        <div style={{flex:1,overflowY:"auto",padding:"12px 10px"}}>

            {[[reportDay==="all"?"Incasso totale":"Incasso giornata",fmt(scopeRev),scopeO.length+" scontrini"],["Scontrino medio",scopeO.length?fmt(scopeRev/scopeO.length):"€0.00","media"],[EVT.totaleLabel,fmt(totalRev),orders.length+" scontrini totali"]].map(([l,v,s])=>(
              <div key={l} style={{background:"#1e293b",borderRadius:12,padding:20,border:"1px solid #334155"}}>
                <div style={{fontSize:12,color:"#64748b",marginBottom:6,textTransform:"uppercase",letterSpacing:1}}>{l}</div>
                <div style={{fontSize:28,fontWeight:900,color:"#4ade80"}}>{v}</div>
                <div style={{fontSize:12,color:"#64748b",marginTop:4}}>{s}</div>

            </div>
          </div>
          <button onClick={anteprimaScontrino} style={{background:"#1d4ed8",border:"1px solid #3b82f6",color:"#fff",padding:"10px 24px",borderRadius:8,cursor:"pointer",fontFamily:"inherit",fontSize:14,fontWeight:700}}>🖨️ Scontrino di Prova</button>
          <ScontrinoConfig cfg={rcptCfg} save={saveRcptCfg} reset={resetRcptCfg} anteprima={anteprimaScontrino} centri={centri} saveCentri={saveCentri} isMobile={false} />
          <FirebaseConfig syncStatus={syncStatus} />
        </div>
      )}
    </div>
  );
}

function CucinaView({ comande, toggleComandaItem, evadiComanda, consegnaScontrino, deleteComanda, archiviaComanda, riportaInAttesa, svuotaStorico, isMobile }) {
  const [tab, setTab] = React.useState("attesa"); // attesa | lavorazione | storico

  // Le comande nuove senza il campo stato sono considerate "attesa"
  const getStato = c => c.evasa ? "evasa" : (c.stato || "attesa");

  const attesa     = comande.filter(c => getStato(c) === "attesa");
  const lavoraz    = comande.filter(c => getStato(c) === "lavorazione");
  const storico    = comande.filter(c => getStato(c) === "evasa").reverse();

  const C = {
    bg:"#1e293b", border:"#334155", input:"#0f172a",
    text:"#e2e8f0", muted:"#94a3b8", price:"#f87171",
    success:"#15803d", successBg:"#14532d", warning:"#fbbf24",
  };

  const ComandaCard = ({ c }) => {
    const stato = getStato(c);
    const evasa = stato === "evasa";
    const isAttesa = stato === "attesa";
    const allDone = !isAttesa && !evasa && c.items.length > 0 && c.items.every(it => it.done);

    const borderColor = isAttesa ? "#fbbf24" : (evasa ? C.border : (allDone ? "#15803d" : "#dc2626"));
    const badgeColor  = isAttesa ? {bg:"#713f12",text:"#fbbf24",icon:"⏳",label:"IN ATTESA"}
                       : (evasa ? {bg:C.successBg,text:"#4ade80",icon:"✅",label:"EVASA"}
                                : (allDone ? {bg:C.successBg,text:"#4ade80",icon:"✔️",label:"PRONTA"}
                                           : {bg:"#991b1b",text:"#fff",icon:"🔥",label:"IN LAVORAZ."}));

    return (
      <div style={{background:C.bg, borderRadius:12, padding:14, border:"2px solid "+borderColor, marginBottom:10, opacity:evasa?0.6:1}}>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10, gap:8}}>
          <div>
            <div style={{fontSize:17, fontWeight:800, color:"#f8fafc", letterSpacing:"-0.3px"}}>
              👤 {c.cliente}
            </div>
            <div style={{fontSize:11, color:C.muted, marginTop:2}}>
              #{String(c.id).padStart(4,"0")} · {c.date}{c.centro ? " · " + c.centro : ""}
            </div>
          </div>
          <span style={{fontSize:11, padding:"4px 10px", borderRadius:20, background:badgeColor.bg, color:badgeColor.text, fontWeight:700, whiteSpace:"nowrap"}}>
            {badgeColor.icon} {badgeColor.label}
          </span>
        </div>

        <div style={{display:"flex", flexDirection:"column", gap:6}}>
          {c.items.map(it => (
            <div key={it.uid} onClick={()=>!evasa && !isAttesa && toggleComandaItem(c, it.uid)}
              style={{
                display:"flex", alignItems:"center", gap:10,
                padding:"10px 12px",
                background: it.done ? "#0a1e0f" : C.input,
                border:"1px solid "+(it.done?"#15803d":C.border),
                borderRadius:8,
                cursor: (evasa || isAttesa) ? "default" : "pointer",
              }}>
              <div style={{
                width:22, height:22, borderRadius:6,
                background: it.done ? "#15803d" : "transparent",
                border:"2px solid "+(it.done?"#15803d":C.muted),
                display:"flex", alignItems:"center", justifyContent:"center",
                flexShrink:0, fontSize:14, color:"#fff", fontWeight:900,
              }}>
                {it.done ? "✓" : ""}
              </div>
              <div style={{flex:1}}>
                <div style={{
                  fontSize:14, fontWeight:700,
                  color: it.done ? C.muted : "#f8fafc",
                  textDecoration: it.done ? "line-through" : "none",
                }}>
                  {it.qty}× {it.name}
                </div>
                {it.variant && (
                  <div style={{
                    fontSize:12, color: it.done ? C.muted : C.warning,
                    fontStyle:"italic", marginTop:2,
                    textDecoration: it.done ? "line-through" : "none",
                  }}>
                    ↳ {it.variant}
                  </div>
                )}
                {it.note && (
                  <div style={{
                    fontSize:12, color: it.done ? C.muted : C.warning,
                    fontStyle:"italic", marginTop:2,
                    textDecoration: it.done ? "line-through" : "none",
                  }}>
                    📝 {it.note}
                  </div>
                )}
              </div>
            </div>
          ))}
        </div>

        {/* AZIONI */}
        {isAttesa && (
          <div style={{display:"flex", gap:8, marginTop:12}}>
            <button onClick={()=>consegnaScontrino(c)} style={{flex:2, background:"#dc2626", border:"none", color:"#fff", padding:"11px", borderRadius:8, cursor:"pointer", fontFamily:"inherit", fontSize:14, fontWeight:700}}>
              🔥 Scontrino consegnato
            </button>
            <button onClick={()=>archiviaComanda(c)} style={{flex:1, background:"#3f2d12", border:"1px solid #b45309", color:"#fbbf24", padding:"11px", borderRadius:8, cursor:"pointer", fontFamily:"inherit", fontSize:13, fontWeight:700}}>
              📜 Storico
            </button>
          </div>
        )}
        {!isAttesa && !evasa && (
          <div style={{display:"flex", gap:8, marginTop:12}}>
            {allDone ? (
              <button onClick={()=>deleteComanda(c)} style={{flex:2, background:"#7f1d1d", border:"none", color:"#fff", padding:"10px", borderRadius:8, cursor:"pointer", fontFamily:"inherit", fontSize:13, fontWeight:700}}>
                🗑 Elimina comanda
              </button>
            ) : (
              <button onClick={()=>evadiComanda(c)} style={{flex:2, background:C.success, border:"none", color:"#fff", padding:"10px", borderRadius:8, cursor:"pointer", fontFamily:"inherit", fontSize:13, fontWeight:700}}>
                ✅ Evadi tutto
              </button>
            )}
            <button onClick={()=>archiviaComanda(c)} style={{flex:1, background:"#3f2d12", border:"1px solid #b45309", color:"#fbbf24", padding:"10px", borderRadius:8, cursor:"pointer", fontFamily:"inherit", fontSize:12, fontWeight:700}}>
              📜 Storico
            </button>
          </div>
        )}
        {evasa && (
          <div style={{display:"flex", gap:8, marginTop:12}}>
            <button onClick={()=>riportaInAttesa(c)} style={{flex:1, background:"#1e3a5f", border:"1px solid #2563eb", color:"#93c5fd", padding:"9px", borderRadius:8, cursor:"pointer", fontFamily:"inherit", fontSize:12, fontWeight:700}}>
              ↩️ Rimetti in attesa
            </button>
            <button onClick={()=>deleteComanda(c)} style={{flex:1, background:"#7f1d1d", border:"none", color:"#fca5a5", padding:"9px", borderRadius:8, cursor:"pointer", fontFamily:"inherit", fontSize:12}}>
              🗑 Elimina
            </button>
          </div>
        )}
      </div>
    );
  };

  const tabs = [
    {key:"attesa",      label:"⏳ In Attesa",      count:attesa.length,    active:"#b45309",  inactive:C.border},
    {key:"lavorazione", label:"🔥 In Lavorazione", count:lavoraz.length,   active:"#dc2626",  inactive:C.border},
    {key:"storico",     label:"📜 Storico",        count:storico.length,   active:"#15803d",  inactive:C.border},
  ];

  const list = tab === "attesa" ? attesa : tab === "lavorazione" ? lavoraz : storico;
  const emptyMsg = tab === "attesa" ? "Nessuna comanda in attesa" : tab === "lavorazione" ? "Nessuna comanda in lavorazione" : "Lo storico è vuoto";
  const emptyEmoji = tab === "attesa" ? "📋" : tab === "lavorazione" ? "😌" : "📭";

  return (
    <div>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14, flexWrap:"wrap", gap:10}}>
        <h2 style={{fontSize:isMobile?18:24, fontWeight:800, color:"#f8fafc", letterSpacing:"-0.4px"}}>
          🧑‍🍳 Cucina
        </h2>
      </div>

      {/* Tab switcher */}
      <div style={{display:"flex", gap:6, marginBottom:14, overflowX:"auto"}}>
        {tabs.map(t => (
          <button key={t.key} onClick={()=>setTab(t.key)}
            style={{
              background: tab===t.key ? t.active : "transparent",
              border:"1px solid "+(tab===t.key ? t.active : t.inactive),
              color: tab===t.key ? "#fff" : C.muted,
              padding:"8px 14px", borderRadius:8, cursor:"pointer",
              fontFamily:"inherit", fontSize:13, fontWeight:700, whiteSpace:"nowrap", flexShrink:0,
            }}>
            {t.label} ({t.count})
          </button>
        ))}
      </div>

      {tab === "storico" && storico.length > 0 && (
        <div style={{textAlign:"right", marginBottom:10}}>
          <button onClick={svuotaStorico} style={{background:"#7f1d1d", border:"1px solid #991b1b", color:"#fca5a5", padding:"7px 14px", borderRadius:8, cursor:"pointer", fontFamily:"inherit", fontSize:12, fontWeight:600}}>
            🗑 Svuota storico ({storico.length})
          </button>
        </div>
      )}

      {list.length === 0 && (
        <div style={{background:C.bg, borderRadius:12, padding:30, border:"1px solid "+C.border, textAlign:"center", color:C.muted}}>
          <div style={{fontSize:40, marginBottom:8}}>{emptyEmoji}</div>
          <div style={{fontSize:14}}>{emptyMsg}</div>
        </div>

      {list.map(c => <ComandaCard key={c._key||c.id} c={c} />)}
